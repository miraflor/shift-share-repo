[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shift-share"
version = "0.1.0"
description = "Expandable Python package for shift-share decompositions."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "James Matthew Miraflor" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
shift-share = "shift_share.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
